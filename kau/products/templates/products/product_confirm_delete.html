{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Confirmar eliminación</h2>

    <p>¿Estás seguro que deseas eliminar el producto "{{ object.nombre }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">
            Eliminar
        </button>
        <a href="{% url 'product_list' %}" class="btn btn-secondary">
            Cancelar
        </a>
    </form>
</div>
{% endblock %}
