{% extends "base.html" %}

{% block content %}
<section class="page-container">

  <div class="order-success">

    <span class="order-eyebrow">Gracias por tu compra</span>

    <h1>Tu Kau ya está en camino</h1>

    <p class="order-message">
      Tu pedido fue creado correctamente.<br>
      Cada pieza será preparada con el mismo cuidado con el que fue pensada.
    </p>

    <div class="order-box">
      <p>
        <strong>Número de pedido</strong><br>
        <span class="order-id">#{{ pedido.id }}</span>
      </p>
    </div>

    <a href="{% url 'core:home' %}" class="btn-main">
      Volver al inicio
    </a>

  </div>

</section>
{% endblock %}
