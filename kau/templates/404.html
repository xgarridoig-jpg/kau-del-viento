{% extends "base.html" %}

    <span class="restricted-eyebrow">Error 404</span>

    <h1>Este sendero no existe</h1>

    <p class="restricted-text">

      <a href="{% url 'core:home' %}" class="btn-main">Volver al inicio</a>
    </div>
  </div>
</section>
{% endblock %}
